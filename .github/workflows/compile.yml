name: PlatformIO Multi-Board Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: esp32_jk_bms

    steps:
    # 1. Клонування репозиторію
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Налаштування Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Кешування пакетів PlatformIO для прискорення наступних збірок
    - name: Cache PlatformIO packages
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-platformio-${{ hashFiles('esp32_jk_bms/**/platformio.ini') }}

    # 4. Встановлення PlatformIO Core
    - name: Install PlatformIO Core
      run: |
        python -m pip install --upgrade pip
        pip install -U platformio

    # 5. Збірка прошивок (pioarduino сам створює і firmware.bin, і повний firmware.factory.bin)
    - name: Build and Prepare Firmware Binaries
      run: |
        pio run
        cp .pio/build/wemos_d1_mini32/firmware.bin ./firmware-wemos-d1-mini32-ota.bin
        cp .pio/build/wemos_d1_mini32/firmware.factory.bin ./firmware-wemos-d1-mini32-full.bin
        cp .pio/build/esp32-s3-zero/firmware.bin ./firmware-esp32-s3-zero-ota.bin
        cp .pio/build/esp32-s3-zero/firmware.factory.bin ./firmware-esp32-s3-zero-full.bin

    # 6. Збереження у внутрішні Artifacts (як резерв)
    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JKBMS-All-Firmwares
        path: |
          esp32_jk_bms/firmware-wemos-d1-mini32-ota.bin
          esp32_jk_bms/firmware-wemos-d1-mini32-full.bin
          esp32_jk_bms/firmware-esp32-s3-zero-ota.bin
          esp32_jk_bms/firmware-esp32-s3-zero-full.bin

    # 7. Публікація відкритого релізу (доступного для скачування без реєстрації на GitHub)
    - name: Publish Public Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest Firmware Builds (OTA & Full Factory) for esp32_jk_bms
        body: |
          Ready-to-flash `.bin` binaries for **WEMOS D1 Mini32** and **Waveshare ESP32-S3-Zero**:
          - **`*-full.bin`**: Complete image (bootloader + partitions + app) for flashing a **brand new ESP32 via USB** (at address `0x0`). Can be easily flashed directly from your browser using **[ESPHome Web](https://web.esphome.io/)** (Chrome/Edge).
          - **`*-ota.bin`**: Application binary only for wireless updates via the **web `/update` page**.
        files: |
          esp32_jk_bms/firmware-wemos-d1-mini32-ota.bin
          esp32_jk_bms/firmware-wemos-d1-mini32-full.bin
          esp32_jk_bms/firmware-esp32-s3-zero-ota.bin
          esp32_jk_bms/firmware-esp32-s3-zero-full.bin
