name: PlatformIO Multi-Board Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: esp32_jk_bms

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache PlatformIO packages
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-platformio-${{ hashFiles('esp32_jk_bms/**/platformio.ini') }}

    - name: Install PlatformIO Core
      run: |
        python -m pip install --upgrade pip
        pip install -U platformio

    # Збірка прошивок для обох плат
    - name: Run PlatformIO Build for All Boards
      run: pio run

    # Копіювання та перейменування бінарників для зручного завантаження
    - name: Prepare Firmware Binaries
      run: |
        cp .pio/build/wemos_d1_mini32/firmware.bin ./firmware-wemos-d1-mini32.bin
        cp .pio/build/esp32-s3-zero/firmware.bin ./firmware-esp32-s3-zero.bin

    # Збереження у внутрішні Artifacts (як резерв)
    - name: Upload Wemos D1 Mini32 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-wemos-d1-mini32
        path: esp32_jk_bms/firmware-wemos-d1-mini32.bin

    - name: Upload ESP32-S3 Zero Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-esp32-s3-zero
        path: esp32_jk_bms/firmware-esp32-s3-zero.bin

    # Публікація відкритого релізу (доступного для скачування без реєстрації на GitHub)
    - name: Publish Public Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest Firmware Builds (D1 Mini32 & S3-Zero)
        body: |
          Pre-compiled `.bin` binaries for **WEMOS D1 Mini32** and **Waveshare ESP32-S3-Zero**.
          Flash directly via the web OTA interface (`/update`) or ESPHome Flasher.
        files: |
          esp32_jk_bms/firmware-wemos-d1-mini32.bin
          esp32_jk_bms/firmware-esp32-s3-zero.bin
