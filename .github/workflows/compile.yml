name: PlatformIO Multi-Board Build (D1 Mini32 & S3-Zero)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: esp32_jk_bms

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache PlatformIO packages
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-platformio-${{ hashFiles('esp32_jk_bms/**/platformio.ini') }}

    - name: Install PlatformIO Core
      run: |
        python -m pip install --upgrade pip
        pip install -U platformio

    # Команда pio run без прапорців автоматично збере ОБИДВА середовища з platformio.ini
    - name: Run PlatformIO Build for All Boards
      run: pio run

    # Викладаємо прошивку для класичного Wemos D1 Mini32
    - name: Upload Wemos D1 Mini32 Firmware
      uses: actions/upload-artifact@v4
      with:
        name: firmware-wemos-d1-mini32
        path: esp32_jk_bms/.pio/build/wemos_d1_mini32/firmware.bin

    # Викладаємо прошивку для нового ESP32-S3 Zero
    - name: Upload ESP32-S3 Zero Firmware
      uses: actions/upload-artifact@v4
      with:
        name: firmware-esp32-s3-zero
        path: esp32_jk_bms/.pio/build/esp32-s3-zero/firmware.bin
