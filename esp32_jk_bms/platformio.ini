; ============================================================================
; PlatformIO Configuration for ESP32 JK-BMS (NimBLE-Arduino Optimized)
; ============================================================================
; Compatible with: WEMOS D1 Mini32, ESP32 DevKit V1, NodeMCU-32S,
; ESP32-WROOM-32, ESP32-S3-Zero
; ============================================================================

[platformio]
default_envs = wemos_d1_mini32, esp32-s3-zero

; Спільні налаштування для обох плат
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
board_build.partitions = min_spiffs.csv

[env:wemos_d1_mini32]
board = wemos_d1_mini32
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.5.2
    tzapu/WiFiManager @ ^2.0.17

build_flags =
    -Os
    -D BOARD_WEMOS_D1_MINI32
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED

[env:esp32-s3-zero]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.5.2
    adafruit/Adafruit NeoPixel
    tzapu/WiFiManager @ ^2.0.17
    
build_flags =
    -Os
    -D BOARD_ESP32_S3_ZERO
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

