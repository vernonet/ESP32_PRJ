name: PlatformIO Build (Nested ESP32 @ 6.4.0)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Примусове налаштування робочої папки для вкладеного проєкту
    defaults:
      run:
        working-directory: esp32_jk_bms

    steps:
    # 1. Клонуємо ваш код на сервер GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. ВСТАНОВЛЮЄМО PYTHON (ВИПРАВЛЕНО НАЗВУ ОФІЦІЙНОГО ПАКЕТА)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Кешуємо пакети PlatformIO (адаптовано під вкладений шлях)
    - name: Cache PlatformIO packages
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-platformio-${{ hashFiles('esp32_jk_bms/**/platformio.ini') }}

    # 4. Встановлюємо PlatformIO Core останньої версії
    - name: Install PlatformIO Core
      run: |
        python -m pip install --upgrade pip
        pip install -U platformio

    # 5. Хмарний сервер заходить в esp32_jk_bms, бере platformio.ini та збирає бінарник
    - name: Run PlatformIO Build
      run: pio run

    # 6. Зберігаємо та викладаємо готовий прошивальний файл .bin
    - name: Upload compiled binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: JKBMS-ESP32-v2-Firmware
        path: esp32_jk_bms/.pio/build/wemos_d1_mini32/firmware.bin
